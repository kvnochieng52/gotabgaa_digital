name: gotabgaa
description: "Gotabgaa Digital — Live TV, radio and news for the Kalenjin community"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Networking / API ---
  http: ^1.2.2
  shared_preferences: ^2.3.2

  # --- HLS live-video player ---
  video_player: ^2.9.2
  chewie: ^1.8.5

  # --- YouTube embed for article videos ---
  youtube_player_flutter: ^9.1.1

  # --- Images & caching ---
  cached_network_image: ^3.4.1

  # --- HTML rendering for article bodies ---
  flutter_html: ^3.0.0

  # --- URL launching (email, phone, social) ---
  url_launcher: ^6.3.1

  # --- Date formatting ---
  intl: ^0.19.0

  # --- Icons ---
  flutter_svg: ^2.0.10+1

  # --- Google Fonts (Poppins loaded at runtime, no asset bundling) ---
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

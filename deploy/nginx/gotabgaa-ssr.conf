# ============================================================
# Alternative nginx config: Next.js in SSR mode (Node.js runtime)
#
# Use this instead of gotabgaa.conf if you want live/dynamic pages
# (e.g. for real-time article updates without rebuild).
#
# BEFORE using this config, remove the static-export line from
# frontend/next.config.ts:
#     output: "export",     ← DELETE this line
# and rebuild:  `npm run build`
#
# You'll also need the systemd unit at deploy/systemd/gotabgaa-frontend.service
# running so the Node process is up on 127.0.0.1:3120.
# ============================================================

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /app/gotabgaa/backend/public;
    index index.php;

    access_log /var/log/nginx/gotabgaa_access.log;
    error_log  /var/log/nginx/gotabgaa_error.log;

    client_max_body_size 20M;

    # --------- Laravel ---------
    location /api/     { try_files $uri $uri/ /index.php?$query_string; }
    location /sanctum/ { try_files $uri $uri/ /index.php?$query_string; }
    location /admin    { try_files $uri $uri/ /index.php?$query_string; }
    location /livewire { try_files $uri $uri/ /index.php?$query_string; }
    location /filament { try_files $uri $uri/ /index.php?$query_string; }
    location /storage/ { try_files $uri =404; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # --------- Everything else → Next.js Node server ---------
    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    location ~ /\.ht  { deny all; }
    location ~ /\.env { deny all; }
    location ~ /\.git { deny all; }
}

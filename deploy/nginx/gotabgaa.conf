# ============================================================
# Gotabgaa Digital — nginx site config
#
# One server block serves BOTH the Laravel backend (via PHP-FPM)
# and the Next.js frontend (static export from `frontend/out/`).
#
# No domain yet — we listen on a random high port. Access the site as:
#   http://SERVER_IP:8090/          → frontend
#   http://SERVER_IP:8090/api/v1/*  → Laravel API
#   http://SERVER_IP:8090/admin     → Filament admin
#   http://SERVER_IP:8090/api/proxy.php → HLS stream proxy
#
# When a domain is later attached:
#   1. Add `server_name yourdomain.com www.yourdomain.com;`
#   2. Change `listen 8090;` to `listen 80;`
#   3. Run `certbot --nginx -d yourdomain.com` — done.
#
# Install:
#   sudo cp deploy/nginx/gotabgaa.conf /etc/nginx/sites-available/gotabgaa
#   sudo ln -s /etc/nginx/sites-available/gotabgaa /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 8090;
    listen [::]:8090;
    server_name _;    # accept any hostname / IP — swap for a domain later

    # --------- Roots ---------
    # `root` points at Laravel's public/ so PHP requests resolve to real files.
    # We fall back to /index.php for API routes. The frontend's static files
    # sit in a separate directory and are served with an `alias` in `location /`.
    root /app/gotabgaa/backend/public;
    index index.php;

    access_log /var/log/nginx/gotabgaa_access.log;
    error_log  /var/log/nginx/gotabgaa_error.log;

    client_max_body_size 20M;

    # --------- Laravel API + auth ---------
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------- Filament admin ---------
    # Filament (Livewire) needs several sub-paths to hit Laravel:
    #   /admin, /livewire/*, /filament/*
    location /admin {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location /filament {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --------- Uploaded files ---------
    # `php artisan storage:link` symlinks public/storage → storage/app/public
    location /storage/ {
        try_files $uri =404;
    }

    # --------- HLS live-stream proxy ---------
    # backend/public/api/proxy.php fetches from the upstream HLS server and
    # streams .ts segments — see docs at deploy/README.md for detail.
    # (No special block needed; the .php$ block below handles it.)

    # --------- PHP-FPM ---------
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # --------- Frontend (static export from Next.js) ---------
    # `next.config.ts` has `output: 'export'` + `trailingSlash: true`, so
    # `npm run build` writes:
    #     frontend/out/index.html
    #     frontend/out/news/index.html
    #     frontend/out/article/<slug>/index.html
    #     etc.
    # We serve those files directly — no Node.js runtime required.
    location / {
        root /app/gotabgaa/frontend/out;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # --------- Static assets (long-cache) ---------
    location /_next/static/ {
        root /app/gotabgaa/frontend/out;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------- Security ---------
    location ~ /\.ht    { deny all; }
    location ~ /\.env   { deny all; }
    location ~ /\.git   { deny all; }
    location ~ /vendor  { deny all; }
    location ~ /storage/(logs|framework)/ { deny all; }
}
